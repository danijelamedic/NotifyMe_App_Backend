syntax = "proto3";

package notifyme.upload;

option java_package = "notifyme.upload.proto";
option java_multiple_files = true;

message UploadCreatedEvent {
  int64 videoId = 1;
  string title = 2;
  int64 sizeBytes = 3;
  string authorUsername = 4;
  string createdAt = 5; // ISO-8601 string (npr. 2026-01-30T14:22:00Z)

}
