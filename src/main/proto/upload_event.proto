syntax = "proto3";

package notifyme.upload.proto;

option java_multiple_files = true;
option java_package = "notifyme.upload.proto";
option java_outer_classname = "UploadCreatedEventProto";

message UploadCreatedEvent {
  int64 videoId = 1;
  string title = 2;
  int64 sizeBytes = 3;
  string authorUsername = 4;
  string createdAt = 5;
}
